# fly.toml file generated for random-touhou-music on 2022-08-29T18:53:59+09:00

app = "random-touhou-music"
kill_signal = "SIGINT"
kill_timeout = 5
processes = []

[env]

[experimental]
  auto_rollback = true

# 新しいマシンを横に立ち上げ、ヘルスチェックに通ってから切り替える。
# 通らなければ古いマシンが動き続けるので、自動デプロイで壊れた版が出ても本番は止まらない
[deploy]
  strategy = "bluegreen"

[[services]]
  internal_port = 4567
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"

  # アプリが HTTP で正しく応答するかを確認する（TCP チェックだけではポートが開いているかしかわからない）
  [[services.http_checks]]
    grace_period = "10s"
    interval = "15s"
    method = "get"
    path = "/up"
    protocol = "http"
    timeout = "2s"
