name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 毎週月曜 12:00 (JST)。成功すると Deploy ワークフローが週 1 回のデプロイを行う。
    # Renovate の週次の Gemfile.lock 更新（月曜 4:00 前）が自動マージされてから動くように、昼にしている。
    # 脆弱性の検知は Dependencies ワークフローで行う（ここに入れると、脆弱性が公開されただけで PR の CI もデプロイも止まるため）
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
      with:
        ruby-version: '.ruby-version'
        bundler-cache: true
        
    # Test は「アプリが動くか」だけを見る。書き方のチェック（RuboCop）は Lint ワークフローで行う
    # （ここに入れると、RuboCop の更新で cop が増えただけで Renovate の PR が止まるため）
    - name: Check Ruby syntax
      run: ruby -c app.rb

    - name: Validate JSON files
      run: |
        for file in data/*.json; do
          echo "Validating $file"
          ruby -e "require 'json'; JSON.parse(File.read('$file'))" || exit 1
        done
        
    - name: Start application
      run: bundle exec ruby app.rb &
      
    - name: Health check
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:4567/ > /dev/null 2>&1; do sleep 1; done'
        curl -f http://localhost:4567/ > /dev/null

    - name: Build production Docker image
      run: docker build -t random-touhou-music .

    # 本番と同じイメージで全経路の動作を確かめる。Renovate の自動マージはこの結果を根拠にする
    - name: Smoke test production Docker image
      run: |
        docker run -d --name app -p 4568:4567 random-touhou-music
        ruby script/smoke_test.rb http://localhost:4568
        test "$(docker exec app id -u)" != "0"

    - name: Show container logs on failure
      if: failure()
      run: docker logs app || true