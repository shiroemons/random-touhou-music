name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 毎週月曜 12:00 (JST)。コードに変更がなくても、新しく公開された脆弱性を bundle audit で検知する。
    # 成功すると Deploy ワークフローが週 1 回のデプロイを行う。
    # Renovate の週次の Gemfile.lock 更新（月曜 4:00 前）が自動マージされてから動くように、昼にしている
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Ruby
      uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
      with:
        ruby-version: '.ruby-version'
        bundler-cache: true
        
    - name: Run security audit
      run: |
        gem install bundler-audit
        bundle audit --update
        
    - name: Lint Ruby code
      run: |
        bundle exec rubocop
        ruby -c app.rb
      
    - name: Validate JSON files
      run: |
        for file in data/*.json; do
          echo "Validating $file"
          ruby -e "require 'json'; JSON.parse(File.read('$file'))" || exit 1
        done
        
    - name: Start application
      run: bundle exec ruby app.rb &
      
    - name: Health check
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:4567/ > /dev/null 2>&1; do sleep 1; done'
        curl -f http://localhost:4567/ > /dev/null

    - name: Build production Docker image
      run: docker build -t random-touhou-music .

    # 本番と同じイメージで全経路の動作を確かめる。Renovate の自動マージはこの結果を根拠にする
    - name: Smoke test production Docker image
      run: |
        docker run -d --name app -p 4568:4567 random-touhou-music
        ruby script/smoke_test.rb http://localhost:4568
        test "$(docker exec app id -u)" != "0"

    - name: Show container logs on failure
      if: failure()
      run: docker logs app || true